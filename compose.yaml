services:
  app:
    build: .
    container_name: employee-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: employee_admin
      DB_PASSWORD: employee_password
      DB_NAME: employee_db
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    container_name: employee-postgres
    environment:
      POSTGRES_USER: employee_admin
      POSTGRES_PASSWORD: employee_password
      POSTGRES_DB: employee_db
    ports:
      - "5432:5432"
    volumes:
      - employee_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U employee_admin -d employee_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  employee_postgres_data: