name: Employee App CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "devops/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server JavaScript syntax
        run: node --check server.js

      - name: Check frontend JavaScript syntax
        run: node --check public/script.js

      - name: Build Docker image
        run: docker build -t employee-app:${{ github.sha }} .